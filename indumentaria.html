<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indumentaria - Compra en Calzada</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo" style="text-decoration: none;">
                <i class="fas fa-arrow-left" style="font-size: 1.2rem;"></i>
                <div>
                    <h1>Indumentaria</h1>
                    <p>Rafael Calzada</p>
                </div>
            </a>
            <div class="category-badge-top bg-blue">Moda y Calzado</div>
        </div>
    </header>

    <main class="container">
        <section class="sub-controls">
            <div class="search-bar-mini">
                <i class="fas fa-search"></i>
                <input type="text" id="filterInput" placeholder="Buscar prenda o local...">
            </div>
        </section>

        <section class="products-grid" id="contenedor-indumentaria">
            <div class="product-card">
                <div class="product-image">
                    <img src="img/placeholder-ropa.jpg" alt="Producto">
                    <span class="shop-name"><i class="fas fa-store"></i> Tienda "El Sol"</span>
                </div>
                <div class="product-info">
                    <h3>Remera Algodón Premium</h3>
                    <p class="product-desc">Varios talles y colores disponibles.</p>
                    <div class="price-row">
                        <span class="price">$15.500</span>
                        <a href="https://wa.me/5491100000000?text=Hola! Me interesa la Remera Algodon" class="btn-whatsapp">
                            <i class="fab fa-whatsapp"></i> Pedir
                        </a>
                    </div>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image">
                    <img src="img/placeholder-zapas.jpg" alt="Producto">
                    <span class="shop-name"><i class="fas fa-store"></i> Calzados Calzada</span>
                </div>
                <div class="product-info">
                    <h3>Zapatillas Urbanas</h3>
                    <p class="product-desc">Del 36 al 44. Super cómodas.</p>
                    <div class="price-row">
                        <span class="price">$42.000</span>
                        <a href="#" class="btn-whatsapp">
                            <i class="fab fa-whatsapp"></i> Pedir
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="mini-footer">
        <p>¿Sos comerciante de ropa? <a href="#">Cargá tus productos acá</a></p>
    </footer>

</body>
</html>
