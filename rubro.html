<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Compra en Calzada - Rubro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="rubro-page">

<header class="navbar">
  <div class="container nav-content">
    <a href="index.html" class="btn-back">
      <i class="fas fa-chevron-left"></i> Volver
    </a>
    <div class="brand">⭐ Compra en Calzada</div>
  </div>
</header>

<div class="container main-content">
  <div class="header-rubro">
    <h1 id="titulo"></h1>
    <span id="cantidad" class="badge-count"></span>
  </div>

  <div id="lista" class="grid-comercios"></div>
</div>

<script src="data/config.js"></script>
<script src="js/app.js"></script>

<script>
(async () => {
  // Función para obtener parámetros (asegurarse que esté en app.js o definirla aquí)
  const getParam = (name) => new URLSearchParams(window.location.search).get(name);
  
  const rubro = getParam("rubro");
  const data = await getComercios(); // Viene de app.js

  const filtrados = data.filter(c => c.rubro === rubro);

  document.getElementById("titulo").innerText = getEmoji(rubro) + " " + rubro;
  document.getElementById("cantidad").innerText = filtrados.length + " locales encontrados";

  renderComercios(filtrados);
})();

function renderComercios(lista) {
  const container = document.getElementById("lista");
  container.innerHTML = "";

  if (lista.length === 0) {
    container.innerHTML = `<p class="empty-state">No hay comercios cargados en este rubro todavía.</p>`;
    return;
  }

  lista.forEach(c => {
    const div = document.createElement("a");
    div.href = `comercio.html?id=${c.id}`;
    div.className = "comercio-card";

    div.innerHTML = `
      <div class="card-icon">${getEmoji(c.rubro)}</div>
      <div class="card-content">
        <h3>${c.nombre}</h3>
        <p>${c.descripcion || "Sin descripción disponible"}</p>
        <span class="view-more">Ver productos <i class="fas fa-arrow-right"></i></span>
      </div>
    `;
    container.appendChild(div);
  });
}

function getEmoji(rubro) {
  const map = {
    Gastronomia: "🍽️",
    Indumentaria: "👕",
    Hogar: "🏠",
    Alimentacion: "🍎",
    Servicios: "✂️",
    Industria: "🔧",
    Otros: "📦"
  };
  return map[rubro] || "🏪";
}
</script>
</body>
</html>
